# =============================================================================
#  configs/blocks-template.conf
#
#  Template for adding a new service.
#
#  STEPS:
#    1. Copy this file:  cp configs/blocks-template.conf configs/blocks-MYSERVICE.conf
#    2. Fill in SERVICE_NAME, BASE_URL, VERSION below
#    3. Replace the ENDPOINTS list with your service's controllers and actions
#    4. Run:  ./seed-permissions.sh --config configs/blocks-MYSERVICE.conf
# =============================================================================

# ── Service identity ──────────────────────────────────────────────────────────
SERVICE_NAME="blocks-MYSERVICE"       # e.g. blocks-idp, blocks-uds, blocks-vault
BASE_URL="https://MYSERVICE.blocks.com"
VERSION="v1"

# ── Endpoints ─────────────────────────────────────────────────────────────────
# Format:  "Controller|ActionMethod|HttpMethod"
# HttpMethod: GET | POST | PUT | PATCH | DELETE
#
# Name and Resource are auto-generated as:
#   {SERVICE_NAME}::{controller_lowercase}::{action_lowercase}
# ─────────────────────────────────────────────────────────────────────────────

ENDPOINTS=(
  # ControllerName
  "MyController|MyAction|POST"
  "MyController|MyOtherAction|GET"

  # AnotherController
  "AnotherController|Create|POST"
  "AnotherController|Get|GET"
  "AnotherController|Update|POST"
  "AnotherController|Delete|DELETE"
)
